version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dentacare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dentacare_db
    ports:
      - "5432:5432"
    volumes:
      - dentacare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dentacare_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dentacare_pgdata:
